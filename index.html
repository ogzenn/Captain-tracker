<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captain Tracker</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f5b800"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fffbe6;--card:#fff;--tx:#1a1a1a;--mu:#666;--ac:#f5b800;--bd:#e8e0b8;--gr:#13803a;--rd:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130a;--card:#211e10;--tx:#f3f0e0;--mu:#a9a58c;--bd:#3a3516;--gr:#4cc775;--rd:#ff7a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600}
.seg button.on{background:var(--ac);color:#000;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:22px;font-weight:800}
.lbl{font-size:12px;color:var(--mu)}
.net{grid-column:1/-1;text-align:center;padding:8px;border-radius:10px;background:var(--bg)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#000;font-weight:700;font-size:16px}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.item:last-child{border:0}
.item button{border:0;background:none;color:var(--rd);font-size:18px}
.pos{color:var(--gr);font-weight:700}.neg{color:var(--rd);font-weight:700}
.gps{font-size:13px;color:var(--mu);margin-top:6px}
.hide{display:none}
</style>
</head>
<body>
<h1>🏍️ Captain Tracker</h1>

<div class="seg" id="range"><button data-r="today" class="on">Today</button><button data-r="all">All time</button></div>
<div class="card"><div class="grid" id="sum"></div></div>

<div class="card">
  <b>📍 Live GPS trip</b>
  <div class="gps" id="gpsInfo">Phone GPS measures distance for you. Keep this page open while riding.</div>
  <div class="big" id="gpsKm">0.00 km</div>
  <button class="btn" id="gpsBtn">▶ Start: heading to pickup</button>
</div>

<div class="seg" id="tabs"><button data-t="day" class="on">Daily</button><button data-t="trip">Trip</button><button data-t="fuel">Petrol</button><button data-t="exp">Extras</button></div>

<div class="card" id="t-day">
  <div class="row"><div style="flex:1"><label>Odometer start</label><input id="o1" type="number" inputmode="decimal"></div>
  <div style="flex:1"><label>Odometer end</label><input id="o2" type="number" inputmode="decimal"></div></div>
  <div class="row"><div style="flex:1"><label>Total earnings (₹)</label><input id="de" type="number" inputmode="decimal"></div>
  <div style="flex:1"><label>No. of trips</label><input id="dn" type="number" inputmode="numeric"></div></div>
  <label>Petrol paid today (₹, optional)</label><input id="dp" type="number" inputmode="decimal">
  <button class="btn" id="addDay">Save day</button>
</div>

<div class="card hide" id="t-trip">
  <label>Earnings (₹)</label><input id="earn" type="number" inputmode="decimal">
  <div class="row"><div style="flex:1"><label>Me → Pickup (km)</label><input id="k1" type="number" inputmode="decimal" step="0.01"></div>
  <div style="flex:1"><label>Pickup → Drop (km)</label><input id="k2" type="number" inputmode="decimal" step="0.01"></div></div>
  <button class="btn" id="addTrip">Save trip</button>
</div>

<div class="card hide" id="t-fuel">
  <div class="row"><div style="flex:1"><label>Price per litre (₹)</label><input id="ppl" type="number" inputmode="decimal" value="130"></div>
  <div style="flex:1"><label>Amount paid (₹)</label><input id="paid" type="number" inputmode="decimal"></div></div>
  <div class="gps" id="litres">Litres: 0.00</div>
  <button class="btn" id="addFuel">Save petrol</button>
</div>

<div class="card hide" id="t-exp">
  <label>Type</label><select id="etype"><option>Water</option><option>Snack</option><option>Tea</option><option>Other</option></select>
  <label>Amount (₹)</label><input id="eamt" type="number" inputmode="decimal">
  <button class="btn" id="addExp">Save expense</button>
</div>

<div class="card"><b>History</b><div id="log"></div></div>
<button class="btn alt" id="csv">⬇ Export CSV</button>

<script>
var S={trips:[],fuel:[],exp:[]},range="today";
try{var s=JSON.parse(localStorage.getItem("cap")||"null");if(s)S=s}catch(e){}
function save(){try{localStorage.setItem("cap",JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var day=function(){return new Date().toISOString().slice(0,10)};
var n=function(i){return parseFloat($(i).value)||0};
var f=function(x){return Math.round(x*100)/100};
function inR(e){return range==="all"||e.d===day()}
function render(){
  var T=S.trips.filter(inR),F=S.fuel.filter(inR),E=S.exp.filter(inR);
  var earn=0,k1=0,k2=0,fu=0,ex=0,lt=0;
  T.forEach(function(t){earn+=t.e;k1+=t.k1;k2+=t.k2});
  F.forEach(function(x){fu+=x.p;lt+=x.l});
  E.forEach(function(x){ex+=x.a});
  var km=k1+k2,net=earn-fu-ex;
  var c=function(l,v){return '<div><div class="lbl">'+l+'</div><div class="big">'+v+'</div></div>'};
  $("sum").innerHTML=c("Earnings","₹"+f(earn))+c("Trips",T.reduce(function(a,t){return a+(t.n||1)},0))+c("Total km",f(km))+c("To pickup / delivery",f(k1)+" / "+f(k2))+c("Petrol","₹"+f(fu)+" ("+f(lt)+" L)")+c("Extras","₹"+f(ex))+
   '<div class="net"><div class="lbl">Net profit</div><div class="big '+(net>=0?"pos":"neg")+'">₹'+f(net)+'</div><div class="lbl">'+(km?"₹"+f(net/km)+" per km":"")+'</div></div>';
  var items=[];
  S.trips.forEach(function(t){items.push({k:"trips",id:t.id,d:t.d,tx:(t.n?"🗓️ ₹"+t.e+" · "+f(t.k2)+" km · "+t.n+" trips":"🏍️ ₹"+t.e+" · "+t.k1+"+"+t.k2+" km")})});
  S.fuel.forEach(function(t){items.push({k:"fuel",id:t.id,d:t.d,tx:"⛽ ₹"+t.p+" @ ₹"+t.pp+"/L = "+f(t.l)+" L"})});
  S.exp.forEach(function(t){items.push({k:"exp",id:t.id,d:t.d,tx:"☕ "+t.t+" ₹"+t.a})});
  items.sort(function(a,b){return b.id-a.id});
  $("log").innerHTML=items.slice(0,40).map(function(i){return '<div class="item"><span>'+i.d.slice(5)+" · "+i.tx+'</span><button onclick="del(\''+i.k+"',"+i.id+')">×</button></div>'}).join("")||'<div class="lbl">Nothing yet</div>';
}
function del(k,id){S[k]=S[k].filter(function(x){return x.id!==id});save();render()}
$("addDay").onclick=function(){var km=n("o2")-n("o1"),e=n("de"),p=n("dp");if(km<=0&&!e)return;
  S.trips.push({id:Date.now(),d:day(),e:e,k1:0,k2:Math.max(km,0),n:n("dn")||1});
  if(p&&n("ppl")!==0||p){var pp=parseFloat(($("ppl")||{}).value)||130;S.fuel.push({id:Date.now()+1,d:day(),p:p,pp:pp,l:p/pp})}
  ["o1","o2","de","dn","dp"].forEach(function(i){$(i).value=""});save();render()};
$("addTrip").onclick=function(){if(!n("earn")&&!n("k1")&&!n("k2"))return;S.trips.push({id:Date.now(),d:day(),e:n("earn"),k1:n("k1"),k2:n("k2")});["earn","k1","k2"].forEach(function(i){$(i).value=""});save();render()};
$("addFuel").onclick=function(){var p=n("paid"),pp=n("ppl");if(!p||!pp)return;S.fuel.push({id:Date.now(),d:day(),p:p,pp:pp,l:p/pp});$("paid").value="";$("litres").textContent="Litres: 0.00";save();render()};
$("addExp").onclick=function(){var a=n("eamt");if(!a)return;S.exp.push({id:Date.now(),d:day(),t:$("etype").value,a:a});$("eamt").value="";save();render()};
function lit(){$("litres").textContent="Litres: "+(n("ppl")?f(n("paid")/n("ppl")):0).toFixed(2)}
$("paid").oninput=lit;$("ppl").oninput=lit;
document.querySelectorAll("#range button").forEach(function(b){b.onclick=function(){range=b.dataset.r;document.querySelectorAll("#range button").forEach(function(x){x.classList.toggle("on",x===b)});render()}});
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){document.querySelectorAll("#tabs button").forEach(function(x){x.classList.toggle("on",x===b)});["day","trip","fuel","exp"].forEach(function(t){$("t-"+t).classList.toggle("hide",t!==b.dataset.t)})}});
$("csv").onclick=function(){var r=["type,date,detail,amount"];S.trips.forEach(function(t){r.push("trip,"+t.d+",\""+t.k1+"+"+t.k2+" km\","+t.e)});S.fuel.forEach(function(t){r.push("petrol,"+t.d+",\""+f(t.l)+" L\","+t.p)});S.exp.forEach(function(t){r.push("extra,"+t.d+","+t.t+","+t.a)});
  var a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(r.join("\n"));a.download="captain-data.csv";a.click()};

/* GPS */
var ph=0,wid=null,last=null,dist=0,leg1=0;
function hav(a,b){var R=6371,r=Math.PI/180,dl=(b.latitude-a.latitude)*r,dn=(b.longitude-a.longitude)*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function pos(p){var c=p.coords;if(c.accuracy>40)return;if(last){var d=hav(last,c);if(d>0.01){dist+=d;last=c}}else last=c;$("gpsKm").textContent=dist.toFixed(2)+" km"}
$("gpsBtn").onclick=function(){
  if(ph===0){if(!navigator.geolocation){$("gpsInfo").textContent="GPS not available";return}
    dist=0;last=null;try{wid=navigator.geolocation.watchPosition(pos,function(e){$("gpsInfo").textContent="Location blocked: allow it in browser settings"},{enableHighAccuracy:true})}catch(e){}
    ph=1;$("gpsBtn").textContent="📦 Picked up: start pickup → drop";$("gpsInfo").textContent="Measuring: me → pickup"}
  else if(ph===1){leg1=dist;dist=0;last=null;ph=2;$("k1").value=f(leg1);$("gpsBtn").textContent="✅ Dropped: finish trip";$("gpsInfo").textContent="Measuring: pickup → drop"}
  else{if(wid!==null)navigator.geolocation.clearWatch(wid);$("k2").value=f(dist);ph=0;$("gpsBtn").textContent="▶ Start: heading to pickup";$("gpsInfo").textContent="Done. Distances filled in the Trip form: add earnings and save.";$("gpsKm").textContent="0.00 km"}
};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
